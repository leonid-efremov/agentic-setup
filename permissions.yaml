version: "1.0.0"
agents:
  spec:
    file_access:
      read:
        - "docs/**"
        - "*.md"
      write:
        - "docs/**"
        - "*.md"
    shell_access:
      allow: false

  plan:
    file_access:
      read:
        - "**/*"
      write:
        - "docs/**"
        - "*.md"
    shell_access:
      allow: false

  build:
    file_access:
      read:
        - "**/*"
      write:
        - "src/**"
        - "lib/**"
        - ".gitignore"
        - "*.toml"
        - "*.md"
        - "*.yaml"
    shell_access:
      allow: true
      allowed_commands:
        - "uv *"
        - "python *"
        - ".venv/Scripts/*"
        - "git *"
        - "cat *"
        - "echo *"
        - "ls *"
        - "pwd *"
        - "mkdir *"
        - "cp *"
        - "which *"
        - "grep *"
        - "docker *"
        - "head *"
        - "tail *"
        - "sort *"
        - "sleep *"
        - "cat *"
        - "wc *"
        - "sed *"
        - "bash *"
        - "curl *"

  test:
    file_access:
      read:
        - "**/*"
      write:
        - "tests/**"
        - "*.toml"
        - "pytest.ini"
    shell_access:
      allow: true
      allowed_commands:
        - "pytest *"
        - "python -m pytest *"
        - "uv run pytest *"
        - "docker *"

  code-review:
    file_access:
      read:
        - "**/*"
      write: []
    shell_access:
      allow: false

  document:
    file_access:
      read:
        - "**/*"
      write:
        - "docs/**"
        - "*.md"
    shell_access:
      allow: false
